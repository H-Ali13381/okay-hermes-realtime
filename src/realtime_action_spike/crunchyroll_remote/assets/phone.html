<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Crunchyroll TV remote</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101014;
      color: #fff;
      font: 18px system-ui;
      min-height: 100vh;
    }
    main { max-width: 640px; margin: auto; padding: 24px; }
    h1 { font-size: 32px; }
    p { color: #bbb; line-height: 1.45; }
    textarea {
      width: 100%;
      min-height: 140px;
      border: 2px solid #555;
      border-radius: 14px;
      padding: 16px;
      background: #1d1d24;
      color: #fff;
      font: 20px system-ui;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    button {
      min-height: 56px;
      border: 0;
      border-radius: 14px;
      background: #f47521;
      color: #111;
      font: 700 17px system-ui;
    }
    button.secondary { background: #34343e; color: #fff; }
    button.danger { background: #5d2931; color: #fff; }
    #status { color: #7ee787; font-weight: 700; }
  </style>
</head>
<body>
  <main data-session="__SESSION_ID__">
    <h1>Crunchyroll TV remote</h1>
    <p id="status">Pairing…</p>
    <p>Watch the TV screen. Tap the field you need using Tab, type or paste here, then send it.</p>
    <textarea
      id="input"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Text or password"
    ></textarea>
    <div class="grid">
      <button id="send">Send text</button>
      <button class="secondary" data-key="Tab">Tab</button>
      <button class="secondary" data-key="Enter">Enter</button>
      <button class="secondary" data-key="Backspace">Backspace</button>
      <button class="danger" id="cancel">Cancel</button>
    </div>
    <p>Text is encrypted before it leaves this phone and is cleared immediately after sending.</p>
    <script src="/assets/tweetnacl.min.js"></script>
    <script src="/assets/phone.js"></script>
  </main>
</body>
</html>

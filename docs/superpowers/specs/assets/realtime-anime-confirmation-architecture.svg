<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
<title id="title">Shared media confirmation architecture</title><desc id="desc">YouTube and anime adapters resolve metadata into PendingMedia. The controller validates confirmation and owns mpv. The Realtime page displays the inline card and relays voice decisions.</desc>
<style>text{font-family:Inter,system-ui,sans-serif}.h{font-size:25px;font-weight:700;fill:#f1f2f3}.k{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#a9c7b0}.b{font-size:17px;fill:#d8dcda}.s{font-size:14px;fill:#9aa2a7}.edge{stroke:#91ae98;stroke-width:3;fill:none;marker-end:url(#a)}.box{fill:#17191c;stroke:#353b40;stroke-width:2}.core{fill:#1b211d;stroke:#607666;stroke-width:3}.state{fill:#141719;stroke:#2b3034;stroke-width:2}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#91ae98"/></marker></defs>
<rect width="1280" height="540" rx="24" fill="#101113"/>
<text x="48" y="54" class="h">Prepare → confirm → play</text><text x="48" y="80" class="s">One controller owns confirmation, playback, progress, and teardown.</text>
<rect x="48" y="120" width="310" height="230" rx="18" class="box"/><text x="74" y="156" class="k">SOURCE ADAPTERS</text><text x="74" y="195" class="h">YouTube + Anime</text><text x="74" y="230" class="b">Resolve metadata only</text><text x="74" y="260" class="s">Title · thumbnail · episode</text><text x="74" y="285" class="s">sub/dub · playback locator</text><text x="74" y="323" class="s">Never launches a player</text>
<rect x="473" y="104" width="342" height="262" rx="18" class="core"/><text x="501" y="143" class="k">AUTHORITATIVE CONTROLLER</text><text x="501" y="184" class="h">PendingMedia</text><text x="501" y="219" class="b">Exact session + pending ID</text><text x="501" y="249" class="s">Confirm · reject · correct</text><text x="501" y="274" class="s">Launch and own sole mpv</text><text x="501" y="299" class="s">Persist preferences + progress</text><text x="501" y="337" class="s">Stop/reap through shared teardown</text>
<rect x="931" y="120" width="301" height="230" rx="18" class="box"/><text x="957" y="156" class="k">REALTIME PAGE</text><text x="957" y="195" class="h">Voice + inline card</text><text x="957" y="230" class="b">Display selected item</text><text x="957" y="260" class="s">Relay yes/no/correction</text><text x="957" y="285" class="s">Keep session conversational</text><text x="957" y="323" class="s">Never executes media</text>
<path d="M358 235 H461" class="edge"/><path d="M815 235 H919" class="edge"/><path d="M919 265 H827" class="edge"/>
<rect x="48" y="412" width="354" height="82" rx="14" class="state"/><text x="70" y="442" class="k">GLOBAL PREFERENCE</text><text x="70" y="472" class="b">Subbed by default; speech can override</text>
<rect x="463" y="412" width="354" height="82" rx="14" class="state"/><text x="485" y="442" class="k">PER-SERIES PROGRESS</text><text x="485" y="472" class="b">Episode · timestamp · duration · completion</text>
<rect x="878" y="412" width="354" height="82" rx="14" class="state"/><text x="900" y="442" class="k">EPISODE END</text><text x="900" y="472" class="b">Resume voice; confirm the next episode</text>
</svg>

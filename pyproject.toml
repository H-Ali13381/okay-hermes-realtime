[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openai-realtime-action-spike"
version = "0.1.0"
description = "FastAPI-based OpenAI Realtime voice function-calling action spike"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
]

[project.scripts]
okay-hermes-realtime-controller = "realtime_action_spike.service:main"
okay-hermes-realtime-activation = "realtime_action_spike.activation_handler:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.hatch.build]
exclude = ["/artifacts"]

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_action_spike"]
include = ["src/realtime_action_spike/web/**"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
